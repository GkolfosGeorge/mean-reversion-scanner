name: Mega-Cap MR Alert

on:
  schedule:
    # NOTE: times below are UTC and tuned for EDT (US Eastern Daylight Time,
    # UTC-4, in effect ~mid-March to early-November). During EST (UTC-5,
    # Nov-Mar) these will fire ~1h before actual open/close — still useful,
    # just shift by 1h manually each Nov/Mar if you want exact timing.
    - cron: '35 13 * * 1-5'   # ~09:35 ET — shortly after market open
    - cron: '5 20 * * 1-5'    # ~16:05 ET — shortly after market close
  workflow_dispatch: {}        # lets you trigger it manually from the Actions tab

jobs:
  mega-cap-alert:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Fundamentals cards. A separate step on purpose:
      # - continue-on-error: if this install fails, the mail still goes out, just without cards
      # - --no-deps: the tagged single-asset-analyzer carries its OWN trading-shared-data pin
      #   in pyproject.toml; without --no-deps it would clash with the one in requirements.txt
      #   the moment shared-data-layer gets a newer tag. Its deps (matplotlib, pandas, ...) are
      #   already installed by requirements.txt above.
      # The tag below is updated by: shared data layer/update_pins.sh saa vX.Y.Z
      - name: Install fundamentals package (optional)
        continue-on-error: true
        run: pip install --no-deps "single-asset-analyzer @ git+https://github.com/GkolfosGeorge/single-asset-analyzer.git@v0.1.2"

      - name: Run mega-cap alert check
        env:
          DATABASE_URL:       ${{ secrets.DATABASE_URL }}     # fundamentals cards (optional: mail still sent without it)
          GMAIL_USER:         ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_RECIPIENT:    ${{ secrets.ALERT_RECIPIENT }}
        run: python mega_cap_alert.py
